name: ORBI Edge ECC Pull Request Gate

on:
  pull_request:
    branches:
      - feature/native-alpha-pairing-ux
  push:
    branches:
      - "feature/ecc-orbi-edge-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbi-edge-ecc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Android SDK manager
        shell: bash
        run: |
          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          test -d "$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Resolved sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Install Android components
        shell: bash
        run: |
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.9"

      - name: Run Android unit tests
        working-directory: android/edge-node-native
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build optimized release APK
        working-directory: android/edge-node-native
        run: gradle :app:assembleRelease --stacktrace --info

      - name: Verify APK and native runtime
        shell: bash
        run: |
          APK="android/edge-node-native/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/liborbi_native.so"
          sha256sum "$APK"