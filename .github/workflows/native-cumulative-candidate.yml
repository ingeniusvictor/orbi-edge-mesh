name: Native Cumulative Candidate

on:
  push:
    branches:
      - feature/native-r3-distributed-feasibility
    paths:
      - "android/edge-node-native/**"
      - "manager/**"
      - "models/**"
      - "config/**"
      - "scripts/pc/**"
      - "research/**"
      - "tests/**"
      - ".github/workflows/native-cumulative-candidate.yml"

concurrency:
  group: native-cumulative-candidate
  cancel-in-progress: true

jobs:
  build-cumulative-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Prepare Android debug signing cache
        run: mkdir -p ~/.android

      - name: Restore stable research debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: orbi-edge-node-debug-keystore-v1-${{ runner.os }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile Python research tooling
        run: |
          python -m py_compile manager/native_mesh_manager.py
          python -m py_compile manager/native_model_placement.py
          python -m py_compile research/distributed_feasibility.py
          python -m py_compile scripts/pc/orbi_signed_chat.py
          python -m py_compile scripts/pc/native_headless_probe.py

      - name: Run manager and research tests
        run: |
          python -m unittest -v \
            tests.test_orbi_signed_chat \
            tests.test_native_mesh_manager \
            tests.test_native_model_placement \
            tests.test_distributed_feasibility \
            tests.test_native_headless_probe

      - name: Run Android unit tests
        working-directory: android/edge-node-native
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build cumulative debug APK
        working-directory: android/edge-node-native
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify cumulative APK
        run: |
          APK="android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/orbi-cumulative-apk.txt
          grep -q "lib/arm64-v8a/liborbi_native.so" /tmp/orbi-cumulative-apk.txt
          sha256sum "$APK" | tee android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk.cert.txt
          printf "%s\n" "$GITHUB_SHA" > android/edge-node-native/app/build/outputs/apk/debug/source-commit.txt

      - name: Upload cumulative research candidate
        uses: actions/upload-artifact@v4
        with:
          name: orbi-edge-node-cumulative-r3
          path: |
            android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk
            android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk.cert.txt
            android/edge-node-native/app/build/outputs/apk/debug/source-commit.txt
          if-no-files-found: error
