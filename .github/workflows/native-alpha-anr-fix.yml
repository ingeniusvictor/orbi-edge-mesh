name: Native Alpha ANR Fix

on:
  push:
    branches:
      - feature/native-alpha-anr-fix
    paths:
      - "android/edge-node-native/**"
      - ".github/workflows/native-alpha-anr-fix.yml"
  pull_request:
    paths:
      - "android/edge-node-native/**"
      - ".github/workflows/native-alpha-anr-fix.yml"

jobs:
  build-alpha-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android unit tests
        working-directory: android/edge-node-native
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build fixed APK
        working-directory: android/edge-node-native
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/liborbi_native.so"
          sha256sum "$APK" | tee android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: orbi-edge-node-native-alpha-anrfix
          path: |
            android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk
            android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
