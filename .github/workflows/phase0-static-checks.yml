name: Phase 0 static checks

on:
  pull_request:
  push:
    branches:
      - feature/phase-0-foundation

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m py_compile scripts/pc/test_llama_server.py
          python -m py_compile scripts/pc/summarize_observability.py
          python -m py_compile scripts/pc/headless_probe.py
          python -m py_compile scripts/pc/watchdog_fault_probe.py
          python -m py_compile scripts/android/check_recovery_policy.py
          python -m py_compile scripts/android/node_idle_monitor.py
          python -m py_compile node/mock_node_agent.py
          python -m py_compile node/mock_inference_server.py
          python -m py_compile node/lifecycle.py
          python -m py_compile node/policy_gate.py
          python -m py_compile node/local_telemetry.py
          python -m py_compile node/power_state.py
          python -m py_compile node/idle_controller.py
          python -m py_compile manager/orbi_manager.py
          python -m py_compile manager/registry.py
          python -m py_compile manager/routing.py
          python -m py_compile manager/heartbeat.py
          python -m py_compile manager/orbi_manager_v2.py
          python -m py_compile manager/orbi_manager_v3.py
          python -m py_compile manager/orbi_manager_v4.py
          python -m py_compile manager/orbi_manager_v5.py
          python -m py_compile manager/orbi_manager_v6.py
          python -m py_compile manager/orbi_manager_v7.py
          python -m py_compile manager/routing_v2.py
          python -m py_compile manager/routing_v3.py
          python -m py_compile manager/routing_v4.py
          python -m py_compile manager/routing_v5.py
          python -m py_compile manager/request_planner.py
          python -m py_compile manager/execution.py
          python -m py_compile manager/execution_v2.py
          python -m py_compile manager/history_routing.py
          python -m py_compile manager/adaptive_scoring.py
          python -m py_compile manager/workload_scoring.py
          python -m py_compile manager/wake_planner.py
          python -m py_compile policy/thermal_power.py
          python -m py_compile discovery/static_discovery.py
          python -m py_compile models/inventory.py
          python -m py_compile models/placement.py
          python -m py_compile models/storage_manager.py
          python -m py_compile models/roles.py
          python -m py_compile observability/events.py
          python -m py_compile observability/store.py
          python -m py_compile observability/metrics.py
          python -m py_compile workloads/profiles.py
          python -m py_compile workloads/classifier.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Shell syntax
        run: |
          bash -n scripts/android/bootstrap_node01_termux.sh
          bash -n scripts/android/build_llama_node01.sh
          bash -n scripts/android/capture_baseline.sh
          bash -n scripts/android/run_smoke_test.sh
          bash -n scripts/android/start_local_server.sh
          bash -n scripts/android/start_headless_node01.sh
          bash -n scripts/android/stop_headless_node01.sh
          bash -n scripts/android/watchdog_node01.sh
          bash -n scripts/android/reset_watchdog_budget.sh

      - name: JSON parse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in [
              Path("contracts/node-capability.schema.json"),
              Path("contracts/model-inventory.schema.json"),
              Path("contracts/execution-event.schema.json"),
              Path("contracts/workload-profile.schema.json"),
              Path("contracts/model-placement.schema.json"),
              Path("contracts/examples/node01-capability.example.json"),
              Path("contracts/examples/node02-capability.example.json"),
              Path("contracts/examples/node03-capability.example.json"),
              Path("contracts/examples/node01-capability-models.example.json"),
              Path("contracts/examples/node02-capability-models.example.json"),
              Path("contracts/examples/node03-capability-models.example.json"),
              Path("contracts/examples/workload-profiles.example.json"),
              Path("contracts/examples/model-placement.example.json"),
              Path("discovery/example-nodes.json"),
          ]:
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)
              print(f"OK: {path}")
          PY
