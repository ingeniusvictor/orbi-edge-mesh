name: Phase 0 static checks

on:
  pull_request:
  push:
    branches:
      - feature/phase-0-foundation

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python -m py_compile scripts/pc/test_llama_server.py
          python -m py_compile node/mock_node_agent.py
          python -m py_compile node/mock_inference_server.py
          python -m py_compile manager/orbi_manager.py
          python -m py_compile manager/registry.py
          python -m py_compile manager/routing.py
          python -m py_compile manager/heartbeat.py
          python -m py_compile manager/orbi_manager_v2.py
          python -m py_compile manager/orbi_manager_v3.py
          python -m py_compile manager/orbi_manager_v4.py
          python -m py_compile manager/orbi_manager_v5.py
          python -m py_compile manager/routing_v2.py
          python -m py_compile manager/routing_v3.py
          python -m py_compile manager/request_planner.py
          python -m py_compile manager/execution.py
          python -m py_compile policy/thermal_power.py
          python -m py_compile discovery/static_discovery.py
          python -m py_compile models/inventory.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Shell syntax
        run: |
          bash -n scripts/android/bootstrap_node01_termux.sh
          bash -n scripts/android/build_llama_node01.sh
          bash -n scripts/android/capture_baseline.sh
          bash -n scripts/android/run_smoke_test.sh
          bash -n scripts/android/start_local_server.sh

      - name: JSON parse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in [
              Path("contracts/node-capability.schema.json"),
              Path("contracts/model-inventory.schema.json"),
              Path("contracts/examples/node01-capability.example.json"),
              Path("contracts/examples/node02-capability.example.json"),
              Path("contracts/examples/node03-capability.example.json"),
              Path("contracts/examples/node01-capability-models.example.json"),
              Path("contracts/examples/node02-capability-models.example.json"),
              Path("contracts/examples/node03-capability-models.example.json"),
              Path("discovery/example-nodes.json"),
          ]:
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)
              print(f"OK: {path}")
          PY
