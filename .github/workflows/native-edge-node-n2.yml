name: Native Edge Node N2 llama.cpp

on:
  push:
    branches:
      - feature/native-n2-llama-prep
    paths:
      - "android/edge-node-native/**"
      - ".github/workflows/native-edge-node-n2.yml"
  pull_request:
    paths:
      - "android/edge-node-native/**"
      - ".github/workflows/native-edge-node-n2.yml"

jobs:
  build-n2:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout ORBI
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        working-directory: android/edge-node-native
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build N2 debug APK
        working-directory: android/edge-node-native
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify Android native packaging
        run: |
          APK="android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/orbi-n2-apk-contents.txt
          grep -q "lib/arm64-v8a/liborbi_native.so" /tmp/orbi-n2-apk-contents.txt
          sha256sum "$APK" | tee android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload N2 research APK
        uses: actions/upload-artifact@v4
        with:
          name: orbi-edge-node-n2-llama-prep
          path: |
            android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk
            android/edge-node-native/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
